[platformio]
default_envs = esp32-s3-prod
src_dir = esp32_gridguard_main
include_dir = esp32_gridguard_main

[env]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8
framework = arduino
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.3
    mandulaj/PZEM-004T-v30@^1.1.2

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM

; ----------------------------------------------------------------------
; Production Firmware: Real ZMPT101B and ACS712 ADC Sampling
; No relay feedback hardware fitted (NOT_INSTALLED)
; ----------------------------------------------------------------------
[env:esp32-s3-prod]
build_flags =
    ${env.build_flags}
    -DGRIDGUARD_PROD=1
    -DRELAY_FEEDBACK_INSTALLED=0

; ----------------------------------------------------------------------
; Production Firmware with Physical Relay Feedback
; Requires isolated opto-coupler feedback hardware — see RELAY_FEEDBACK_WIRING.md
; ----------------------------------------------------------------------
[env:esp32-s3-prod-fb]
build_flags =
    ${env.build_flags}
    -DGRIDGUARD_PROD=1
    -DRELAY_FEEDBACK_INSTALLED=1

; ----------------------------------------------------------------------
; Development Test Mode: Controlled Sensor Injection + Test Suite
; Simulator feedback (mirrors commanded state)
; ----------------------------------------------------------------------
[env:esp32-s3-test]
build_flags =
    ${env.build_flags}
    -DDEV_TEST_MODE=1
    -DRELAY_FEEDBACK_INSTALLED=0
    -DGRIDGUARD_TESTS=1
